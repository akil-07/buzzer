{% extends 'base.html' %}

{% block title %}Buzzer System - Home{% endblock %}

{% block content %}
    <h1>⚡ Event Buzzer ⚡</h1>
    <p>Real-time fastest-finger-first buzzer system for your events.</p>
    
    <div style="margin-top: 40px; display: flex; flex-direction: column; gap: 20px;">
        <button id="createEventBtn" class="btn-primary" style="padding: 20px; font-size: 1.3rem;">Create New Event (Host)</button>
    </div>

{% endblock %}

{% block scripts %}
<script>
    const backendUrl = '{{ backend_url }}' || undefined;
    const socket = io(backendUrl, {
        transports: ['websocket', 'polling']
    });

    socket.on('connect', () => {
        console.log('Connected to socket server');
    });

    socket.on('connect_error', (err) => {
        console.error('Socket connection error:', err);
    });

    document.getElementById('createEventBtn').addEventListener('click', () => {
        socket.emit('create_room');
    });

    socket.on('room_created', (data) => {
        window.location.href = `/host/${data.code}`;
    });
</script>
{% endblock %}
